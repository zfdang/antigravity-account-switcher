name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test
        env:
          SKIP_LIVE_KEYCHAIN_TESTS: '1'
        run: swift test
      - name: Build unsigned test bundle
        env:
          UNSIGNED_BUILD: '1'
          DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
        run: ./scripts/build.sh
